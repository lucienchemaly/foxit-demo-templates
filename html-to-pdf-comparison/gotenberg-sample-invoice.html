<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sample Invoice</title>
  <style>
    body { font-family: Helvetica, Arial, sans-serif; margin: 40px; color: #1a1a1a; }
    h1 { color: #FF8A3A; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
    .total { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Invoice #1042</h1>
  <p>Billed to: Acme Robotics<br>Date: 2026-10-16</p>
  <table>
    <tr><th>Item</th><th>Qty</th><th>Price</th></tr>
    <tr><td>API Integration Consulting</td><td>10</td><td>$150.00</td></tr>
    <tr><td>Support Hours</td><td>5</td><td>$90.00</td></tr>
  </table>
  <p class="total">Total: $1,950.00</p>
</body>
</html>
